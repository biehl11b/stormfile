name: Bundle fonts
# Copies the app's fonts (SIL Open Font License) into vendor/fonts so StormFile never asks Google Fonts for anything.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fonts.yml']
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download fonts into vendor/fonts
        run: |
          mkdir -p /tmp/f && cd /tmp/f && npm init -y >/dev/null
          npm i @fontsource/barlow-condensed @fontsource/ibm-plex-sans @fontsource/ibm-plex-mono
          D=$GITHUB_WORKSPACE/vendor/fonts; mkdir -p $D
          for w in 500 600 700; do cp node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-$w-normal.woff2 $D/; done
          for w in 400 500 600; do cp node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-$w-normal.woff2 $D/; done
          cp node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2 $D/
          for p in barlow-condensed ibm-plex-sans ibm-plex-mono; do cp node_modules/@fontsource/$p/LICENSE $D/LICENSE-$p.txt 2>/dev/null || true; done
          ls -la $D
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/fonts; git commit -m "Bundle app fonts locally (no Google Fonts requests)" || echo nothing; git push
