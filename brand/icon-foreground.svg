<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25528f"/><stop offset="1" stop-color="#0d2350"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f6fa"/><stop offset="0.55" stop-color="#b9c7d9"/><stop offset="1" stop-color="#8ea3bf"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/><stop offset="1" stop-color="#c4d2e4"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c2cfe0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d2ff"/><stop offset="1" stop-color="#4f95f0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#061433" flood-opacity="0.45"/></filter>
    <style>@font-face{font-family:Head;src:url("file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf")}</style>
  </defs>
  
  
  <g filter="url(#soft)">
    <!-- shield -->
    <path transform="translate(12 0)" d="M500 190 L700 258 L700 428 C700 566 616 654 500 702 C384 654 300 566 300 428 L300 258 Z" fill="#163a72" stroke="url(#silver)" stroke-width="30" stroke-linejoin="round"/>
    <!-- house -->
    <path d="M372 552 L512 444 L652 552 L652 668 L372 668 Z" fill="url(#wall)"/>
    <rect x="487" y="560" width="50" height="40" rx="4" fill="#1b3c70"/>
    <path d="M292 576 L512 404 L732 576" fill="none" stroke="#ffffff" stroke-width="46" stroke-linejoin="miter" stroke-linecap="square"/>
    <!-- storm cloud -->
    <g transform="translate(4 -6)">
      <path d="M582 318 C548 318 528 296 532 270 C536 244 562 230 588 236 C596 204 628 184 664 190 C696 196 718 220 720 248 C746 248 766 268 764 292 C762 310 748 318 730 318 Z" fill="url(#cloud)"/>
      <path d="M660 314 L626 378 L654 378 L634 434 L700 352 L670 352 L690 314 Z" fill="url(#bolt)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
      <g stroke="#9fc7f5" stroke-width="9" stroke-linecap="round">
        <line x1="590" y1="342" x2="580" y2="366"/><line x1="728" y1="340" x2="718" y2="364"/><line x1="606" y1="384" x2="598" y2="402"/>
      </g>
    </g>
  </g>
  <text x="512" y="878" text-anchor="middle" font-family="Head, Poppins, sans-serif" font-weight="700" font-size="124" letter-spacing="4" fill="#ffffff" filter="url(#soft)">STORMFILE</text>
</svg>
